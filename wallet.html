<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f5f4ed">
    <title>Verdant — Wallet</title>
    <script>
        try {
            var th = localStorage.getItem("vd_theme");
            if (th) document.documentElement.dataset.theme = th
        } catch (e) {}
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
    <link rel="modulepreload" href="assets/js/app.js">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="loading-screen" id="loading" role="status" aria-live="polite">
        <div class="vd-loader">
            <svg viewBox="0 0 64 64" class="vd-leaf" aria-hidden="true">
                <path class="vd-stem" d="M32 56 C32 44 32 30 32 16" />
                <path class="vd-blade vd-l" d="M32 40 C19 40 11 31 11 18 C24 18 32 27 32 40Z" />
                <path class="vd-blade vd-r" d="M32 30 C45 30 53 21 53 8 C40 8 32 17 32 30Z" />
            </svg>
            <div class="vd-word">Verdant</div>
            <div class="vd-bar"><i></i></div>
        </div>
    </div>

    <div class="app">
        <div class="topbar" data-topbar>
            <div class="topbar-title" data-i18n="my_wallet">My Wallet</div>
            <div class="topbar-actions"><a href="history.html" class="icon-btn" aria-label="History">🧾</a></div>
        </div>
        <div class="page" data-page data-nav="wallet.html">
            <div class="wallet-hero">
                <div class="label" data-i18n="total_avail">Total Available</div>
                <div class="total" data-wallet-balance>$0<small>.00</small></div>
                <div class="wallet-stats">
                    <div><small data-i18n="pending">Pending</small><strong data-wallet-pending>$0.00</strong></div>
                    <div><small data-i18n="lifetime">Lifetime</small><strong data-wallet-lifetime>$0.00</strong></div>
                    <div><small data-i18n="withdrawn">Withdrawn</small><strong data-wallet-withdrawn>$0.00</strong></div>
                </div>
            </div>
            <button class="btn-primary" data-act="open-withdraw" data-i18n="convert_btn">⇄ Convert to Currency</button>
            <div class="section-head">
                <h2 data-i18n="recent">Recent activity</h2><a href="history.html" data-i18n="view_all">View all →</a>
            </div>
            <div class="tx-list" data-tx-list></div>
        </div>
        <div data-extra>
            <div class="modal-overlay" id="withdraw-modal">
                <div class="modal">
                    <div class="modal-handle"></div>
                    <h3 data-i18n="cv_title">Convert to Currency</h3>
                    <p data-i18n="cv_note">Minimum $2.00 · 4% conversion fee · 1–3 business days</p>
                    <form data-withdraw-form>
                        <div class="form-field"><label data-i18n="amount_usd">Amount (USD)</label>
                            <input type="number" name="amount" id="convert-amount" placeholder="0.00" min="2" step="0.01" required>
                        </div>
                        <div class="form-field"><label data-i18n="country">Country / Currency</label>
                            <select name="method" id="convert-country" required>
                                <option value="" data-i18n="select_country">Select country</option>
                                <option value="BD">Bangladesh (BDT)</option>
                                <option value="IN">India (INR)</option>
                                <option value="ID">Indonesia (IDR)</option>
                                <option value="NP">Nepal (NPR)</option>
                            </select>
                        </div>
                        <div class="convert-preview" id="convert-preview" hidden>
                            <div class="convert-row"><span data-i18n="usd_amount">USD amount</span><strong data-cv-usd>$0.00</strong></div>
                            <div class="convert-row"><span data-i18n="fee">Fee (4%)</span><strong data-cv-fee>−$0.00</strong></div>
                            <div class="convert-row"><span data-i18n="net_usd">Net USD</span><strong data-cv-net>$0.00</strong></div>
                            <div class="convert-row highlight"><span data-cv-label>You receive</span><strong data-cv-local>—</strong></div>
                        </div>
                        <div class="form-field"><label data-i18n="acct_recv">Receiving account / number</label>
                            <input type="text" name="account" maxlength="120" data-i18n-ph="acct_recv_ph" placeholder="Mobile wallet / bank / UPI number" required>
                        </div>
                        <div class="modal-actions">
                            <button type="button" class="btn-secondary" data-act="close-withdraw" data-i18n="cancel">Cancel</button>
                            <button type="submit" class="btn-primary" data-i18n="submit_convert">Submit convert</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item"><span class="nav-icon">⌂</span><span data-i18n="nav_home">Home</span></a>
            <a href="tasks.html" class="nav-item"><span class="nav-icon">✳</span><span data-i18n="nav_tasks">Tasks</span></a>
            <a href="leaderboard.html" class="nav-item"><span class="nav-icon">🏆</span><span data-i18n="nav_rank">Rank</span></a>
            <a href="wallet.html" class="nav-item"><span class="nav-icon">◇</span><span data-i18n="nav_wallet">Wallet</span></a>
            <a href="profile.html" class="nav-item"><span class="nav-icon">◎</span><span data-i18n="nav_profile">Profile</span></a>
        </nav>
    </div>

    <div class="toast" id="toast"></div>

    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
